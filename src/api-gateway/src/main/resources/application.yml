server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  
  redis:
    host: ${REDIS_HOST:valkey-cart}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  cloud:
    gateway:
      metrics:
        enabled: true
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
        http2: true
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST
        - name: RequestSize
          args:
            maxSize: 5000000

# Service URLs Configuration
services:
  # gRPC服务 - 通过前端代理访问
  cart:
    url: ${CART_ADDR:http://frontend:8080}
  email:
    url: ${EMAIL_ADDR:http://email:6060}
  shipping:
    url: ${SHIPPING_ADDR:http://shipping:50050}
  quote:
    url: ${QUOTE_ADDR:http://quote:8090}
  
  # gRPC服务 - 通过前端代理访问
  ad:
    url: ${AD_ADDR:http://frontend:8080}
  checkout:
    url: ${CHECKOUT_ADDR:http://frontend:8080}
  currency:
    url: ${CURRENCY_ADDR:http://frontend:8080}
  payment:
    url: ${PAYMENT_ADDR:http://frontend:8080}
  product-catalog:
    url: ${PRODUCT_CATALOG_ADDR:http://frontend:8080}
  recommendation:
    url: ${RECOMMENDATION_ADDR:http://frontend:8080}
  load-generator:
    url: ${LOAD_GENERATOR_ADDR:http://load-generator:8089}
  otel-collector:
    url: ${OTEL_COLLECTOR_HTTP_ADDR:http://otel-collector:4318}
  image-provider:
    url: ${IMAGE_PROVIDER_ADDR:http://image-provider:8081}
  flagd:
    url: ${FLAGD_ADDR:http://flagd:8013}
  flagd-ui:
    url: ${FLAGD_UI_ADDR:http://flagd-ui:3000}
  frontend:
    url: ${FRONTEND_ADDR:http://frontend:8080}
  grafana:
    url: ${GRAFANA_ADDR:http://grafana:3000}
  jaeger:
    url: ${JAEGER_ADDR:http://jaeger:16686}

# OpenTelemetry Configuration
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
  resource:
    attributes:
      service.name: ${OTEL_SERVICE_NAME:api-gateway}
      service.version: ${OTEL_SERVICE_VERSION:1.0.0}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    com.opentelemetry.demo.gateway: INFO
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
